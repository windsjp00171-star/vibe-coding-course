<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理後台｜Vibe Coding 實戰課</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/course.css?v=202609261431">
  <style>
    .roster { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .files-steps { margin: 6px 0 12px; border: 1.5px solid var(--line); border-radius: var(--radius-m); padding: 10px 14px; background: var(--paper-2); }
    .files-steps summary { cursor: pointer; }
    .files-steps ol { margin: 10px 0 6px; padding-left: 1.3em; display: grid; gap: 6px; }
    .files-steps .muted { font-size: .88rem; }
    .admin-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .admin-tools .chip-row { flex: 1 1 auto; }
    .admin-search { font: inherit; font-size: .9rem; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); min-width: 12em; }
    .admin-search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .grid-4 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); }
    .roster th.col-closed { opacity: .4; }
    .open-until { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; margin: 10px 0 4px; }
    .open-until select { font: inherit; font-weight: 500; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
    .roster th, .roster td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    .roster th:first-child, .roster td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
    .roster .cell-done { background: var(--ok-soft); color: var(--ok); font-weight: 800; }
    .roster .cell-try { background: var(--warn-soft); color: var(--warn); }
    .code-badge { font-family: var(--mono); font-size: 1.4rem; font-weight: 900; letter-spacing: .15em; color: var(--brand); }
  </style>
</head>
<body data-base="./">
<header data-course-header></header>

<main class="wrap">
  <section class="module-hero slide">
    <span class="eyebrow">講師專用</span>
    <h1>管理<em>後台</em></h1>
    <p class="lead">開通會員、設定講師、開班級、看學習進度。只有被設定為講師的 Google 帳號看得到資料。</p>
  </section>

  <section class="slide" data-tour="dash" data-dashboard aria-live="polite">
    <div class="card"><p class="muted">載入中…</p></div>
  </section>
</main>

<footer class="site-footer"><div class="wrap">Vibe Coding 實戰課．講師後台　所有資料權限由資料庫把關，學員看不到其他人的進度。</div></footer>
